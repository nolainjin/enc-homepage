<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title">
  <title id="title">E&amp;C Footer Logo</title>
  <style>
    .icon { fill: #2d84dd; }
    .mark {
      fill: #ffffff;
      font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
      font-size: 76px;
      font-weight: 700;
      letter-spacing: -0.09em;
    }
    .main {
      fill: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }
    .kr {
      fill: rgba(255,255,255,0.82);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }
  </style>
  <rect x="10" y="28" width="124" height="124" rx="28" class="icon"/>
  <text x="24" y="116" class="mark" textLength="92" lengthAdjust="spacingAndGlyphs">e&amp;c</text>
  <text x="178" y="85" class="main">emotion &amp; cognition</text>
  <text x="180" y="132" class="kr">심 리 상 담 · 학 습 센 터</text>
</svg>
