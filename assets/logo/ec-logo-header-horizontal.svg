<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title">
  <title id="title">E&amp;C Header Logo</title>
  <style>
    .icon { fill: #1f76cd; }
    .mark {
      fill: #ffffff;
      font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
      font-size: 82px;
      font-weight: 700;
      letter-spacing: -0.09em;
    }
    .word {
      fill: #214f72;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 60px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .sub {
      fill: #5f5550;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0.22em;
    }
  </style>
  <rect x="8" y="22" width="136" height="136" rx="30" class="icon"/>
  <text x="24" y="119" class="mark" textLength="102" lengthAdjust="spacingAndGlyphs">e&amp;c</text>
  <text x="180" y="86" class="word">E&amp;C</text>
  <text x="183" y="122" class="sub">emotion &amp; cognition</text>
</svg>
